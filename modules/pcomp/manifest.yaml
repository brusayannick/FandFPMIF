id: pcomp
name: Pcomp
version: 0.2.0
category: advanced
description: Process hypothesis testing — compare two event logs using Earth Mover's Distance with a permutation test or a bootstrap test, and get a p-value.
author: Cameron Pitsch
license: MIT
isConfidentialSafe: true

requirements:
  event_log:
    log_model: case_centric
    required_columns:
      - case_id
      - activity
      - timestamp
    min_events: 50
    min_cases: 2

consumes:
  - log.imported

dependencies:
  python:
    requires-python: ">=3.10"
    packages:
      - "pcomp @ git+https://github.com/cpitsch/pcomp.git"
      - "wasserstein>=1.1.0"
      - "strsimpy>=0.2.1"
      - "scipy>=1.12.0,<1.14.0"
      - "pot>=0.9.2"
      - "pathos>=0.3.2"
      - "rustxes>=0.2.2"
      - "scikit-learn>=1.3.2"
    inherit:
      - pm4py
      - pandas
    isolation: in_process

frontend:
  panel: ./panel/index.tsx

permissions:
  - read:event_log
  - write:module_results
